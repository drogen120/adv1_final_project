[workspace]
authors = ["Wang Qianlong <wangqianlong120@gmail.com>"]
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
name = "adv1_final_project"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
build = { cmd = "colcon build --symlink-install", cwd = "ros2_ws" }

[dependencies]
python = "3.12.*"
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-ros2-control = ">=4.47.0,<5"
ros-jazzy-ros2-controllers = ">=4.42.1,<5"
ros-jazzy-rosbag2-storage-mcap = ">=0.26.11,<0.27"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-joint-state-publisher-gui = ">=2.4.3,<3"
ros-jazzy-joy = ">=3.3.0,<4"
ros-jazzy-teleop-twist-keyboard = ">=2.4.1,<3"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=2.0.0,<3"
cmake = ">=4.4.4,<5"
pkg-config = ">=0.29.2,<0.30"
make = ">=4.4.1,<5"
ninja = ">=1.13.2,<2"

[pypi-dependencies]
mujoco = ">=3.15.0, <4"
